<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Tu asistente personal en Punta Alta: ficha médica de emergencia SOS, farmacias de turno en tiempo real con geolocalización y llamadas directas." />
    <meta property="og:title" content="Vortex ID · Punta Alta" />
    <meta property="og:description" content="Ficha de emergencia, farmacias de turno y llamadas rápidas en Punta Alta." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#030816" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vortex ID" />
    <meta property="og:locale" content="es_AR" />
    <link rel="manifest" href="/manifest.json?v=36" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=36" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=36" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vortex_theme_v1');
          var mode = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          root.style.colorScheme = mode;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', mode === 'dark' ? '#030816' : '#f4f7fb');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
      (function () {
        window.__vortexDeferredInstallPrompt = null;
        window.__vortexAppInstalled = false;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__vortexDeferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('vortex_beforeinstallprompt_ready'));
        });
        window.addEventListener('appinstalled', function () {
          window.__vortexAppInstalled = true;
          window.__vortexDeferredInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('vortex_native_app_installed'));
        });
      })();
    </script>
  </head>
  <body class="bg-[#f4f7fb] dark:bg-[#030816] text-slate-900 dark:text-[#eaf3ff] antialiased selection:bg-[#37c8ff]/30 selection:text-slate-950 dark:selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
